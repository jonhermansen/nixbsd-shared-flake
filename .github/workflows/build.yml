name: build

on:
  push:

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Aggressive cleanup
        run: |
          df -h

          # Remove Java (JDKs)
          sudo rm -rf /usr/lib/jvm

          # Remove .NET SDKs
          sudo rm -rf /usr/share/dotnet

          # Remove Swift toolchain
          sudo rm -rf /usr/share/swift

          # Remove Haskell (GHC)
          sudo rm -rf /usr/local/.ghcup

          # Remove Julia
          sudo rm -rf /usr/local/julia*

          # Remove Android SDKs
          sudo rm -rf /usr/local/lib/android

          # Remove Chromium (optional if not using for browser tests)
          sudo rm -rf /usr/local/share/chromium

          # Remove Microsoft/Edge and Google Chrome builds
          sudo rm -rf /opt/microsoft /opt/google

          # Remove Azure CLI
          sudo rm -rf /opt/az

          # Remove PowerShell
          sudo rm -rf /usr/local/share/powershell

          # Remove CodeQL and other toolcaches
          sudo rm -rf /opt/hostedtoolcache

          df -h
      - uses: actions/checkout@v6.0.2
      - uses: cachix/install-nix-action@v31.9.0
      - uses: cachix/cachix-action@v16
        with:
          name: jonhermansen
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
      # Build nixosSystem (includes nixbsdSystem) and push all deps to cachix
      - run: cachix watch-exec jonhermansen -- nix build -L .#nixosSystem --no-link
      # Build final image
      - run: nix build -L .#zfsImage
      # Push any remaining paths to cachix (just in case)
      - run: nix path-info .#nixosSystem --recursive | cachix push jonhermansen
      
      # Create release with the disk image
      - name: Create Release
        uses: softprops/action-gh-release@v2.5.0
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: build-${{ github.run_number }}
          name: Build ${{ github.run_number }}
          files: result/nixos.root.img
          body: |
            Automated build from commit ${{ github.sha }}
            Build number: ${{ github.run_number }}
