name: build

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6.0.2
      - uses: cachix/install-nix-action@v31.9.0
      - uses: cachix/cachix-action@v16
        with:
          name: jonhermansen
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
      - run: nix build .#packages.x86_64-linux.zfsImage --no-link
      - run: |
          OUT=$(nix eval --raw .#packages.x86_64-linux.zfsImage)
          nix path-info -r "$OUT" | grep -v "^$OUT$" | cachix push jonhermansen
